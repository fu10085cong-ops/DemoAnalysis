[problems]
# died_without_seeing：几何视野仍可能漏判部分模型，暂时停用，待用数据校准
# turned_into_flash：路人并不比职业多，主要反映对手的道具水平，降为背景
# weapon_not_ready：路人与职业一样多，多数是被迫的，降为背景
# spray_while_moving：几乎不触发，暂时停用，待用数据校准
# awp_unscoped_shot：路人样本中零次，暂时停用，待用数据校准
disabled = ["died_without_seeing", "turned_into_flash", "weapon_not_ready", "spray_while_moving", "awp_unscoped_shot"]
# 整场同一发数段难以积累足够子弹，暂时关闭；不影响单次交火，待用数据校准
spray_match_enabled = false
# 假设真实频率与职业相同，单场碰巧出现至少本场次数的最大概率
frequency_max_chance = 0.05
# 相比职业频率预期至少多出几次才算突出
frequency_min_excess = 2
# AWP 超过此距离的未开镜射击参与检测（米，待用数据校准）
awp_noscope_max_distance_m = 5.0
# 单次交火压枪评价从第 4 发开始，recoil_index 从 0 起算
spray_late_recoil_index = 3
# 单次交火后段至少需要的子弹数
spray_min_late_shots = 6
# 比职业期望命中率低多少个百分点才命中
spray_margin_pct = 15.0
# 超过此交火距离（米）不评价单次交火压枪
spray_max_distance_m = 30.0
# 整场按武器、按发数段评价至少需要的子弹数
spray_min_segment_shots = 30
# 移动扫射评价从连射第 2 发开始，排除首枪
spray_moving_min_recoil_index = 1
# 移动扫射评价至少需要的连续射击子弹数
spray_moving_min_shots = 4
# 移动扫射中未停稳子弹的比例阈值（待用数据校准）
spray_moving_ratio = 0.5
# 看见对手前至少开出多少枪时，不判断出枪慢和准星
max_shots_before_seen = 1
# 准星转角相对职业 75 分位的余量
crosshair_margin_ratio = 0.10
# 先看见、先开枪至少领先的秒数；0.045 让 64 tick 下的 3 tick（0.047 秒）刚好够格
highlight_min_lead_s = 0.045
# 已被其他队友补上的记录不作为漏补枪问题
missed_trade_exclude_traded_by_other = true


# 检测规则阈值配置。所有阈值都放在这里，代码中不要写死。
# 用户配置（--config）只需写要覆盖的条目，其余沿用这里的默认值。

[parsing]
# 支持的 tick rate（由 game_time 估算）；估算结果不在其中时报错
supported_tick_rates = [64, 128]
# 目标玩家数据完整性：回合进行中（冻结期结束 → 回合结束）坐标非空的 tick 占比下限
# 低于此值说明 demoparser2 没读到该玩家（docs/fields.md 陷阱 12），直接报错
min_target_coverage = 0.95
# 其他玩家低于此占比时只记警告（影响与其相关的指标）
min_other_coverage = 0.95
# demo 中没有 mp_buytime 设置时使用的购买时间（秒）；官方竞技模式为 20
default_buytime_seconds = 20
# 中途掉线 / 重连（docs/fields.md 陷阱 24）：回合进行中至少这一比例的 tick 没有队伍、
# 且该玩家这一回合没有任何开枪、伤害、击杀、死亡事件，算"不在场"，不计入覆盖率和问题频率
absent_team_ratio = 0.5
# 不在场的回合超过总回合数的这一比例时不做排除（数据多半有别的问题），仍按覆盖率报错
max_absent_round_share = 0.5

[moments]
# 交火窗口（动态回溯）：从击杀 / 死亡往前，把双方的开枪和互相伤害串起来，
# 相邻两次间隔不超过 gap 秒就算同一次交火；整段最长不超过 max 秒
engagement_gap_seconds = 1.0
engagement_max_seconds = 5.0
# 补枪：被击杀后多少秒内击杀者被队友击杀，算"被补回"；反之亦然
trade_window_seconds = 5.0
# 漏补：队友阵亡时目标玩家与他的直线距离不超过此值（游戏单位）才算"在附近"。不考虑视线，只是近似
missed_trade_max_distance = 800
# 关键助攻：闪光助攻，或本回合对被击杀者造成的伤害不低于此值（记分板的伤害助攻本身要求 > 40）
key_assist_min_damage = 60
# 死亡时算"被闪中"的最短致盲时长（秒）。不到 1 秒的多是擦边闪（docs/fields.md §7）
min_blind_seconds = 1.0

# 游戏内跳转：跳到交火开始前多少秒
jump_lead_seconds = 5.0
# 接触时刻（双方中较早看见对方的那一 tick）前这么多秒内的平均速度，用来判断谁在移动、谁在架点
contact_speed_window_seconds = 0.25
# 平均速度低于 still 算"几乎静止"（架点），不低于 moving 算"在移动"（跑动、静步），中间（减速、急停中）不下结论。
# 依据：3 个 demo、878 个样本的速度分布有两个峰（0–10 和 200–220），中间 20–120 是过渡状态
contact_still_speed = 40.0
contact_moving_speed = 120.0

[economy.grenade_prices]
# 死亡时浪费的道具按平台购买价格计价（美元）
flashbang = 200
smokegrenade = 300
hegrenade = 300
molotov = 400
incgrenade = 600
decoy = 50

[weapons.min_shot_interval_seconds]
# 同一把枪两次开枪的最短间隔（秒）。用 10 个 5E / 完美 demo 中同一玩家同一把枪相邻两次开枪的间隔实测（1 分位），
# 与游戏设定一致（AWP 拉栓约 1.45 秒）。用来判断阵亡时是否来得及再开一枪；只列开枪间隔长、会影响判断且样本足够实测的武器
awp = 1.45
ssg08 = 1.25
mag7 = 0.84
deagle = 0.22

[aim]
# 判断一发子弹打向哪个敌人：取子弹方向与"眼睛 → 敌人身体中心"夹角最小的存活敌人（取开枪前一 tick 的位置）。
# 用命中的子弹核对，5 个样本 demo 中 96%–99% 判对；命中子弹的夹角 99 分位约 10°
# 最近的敌人也超过这个角度（度）时，认为这发子弹没有瞄准任何人
max_target_angle = 20.0
# 高度都是相对脚底（Z）的估计值，站立与下蹲之间按 duck_amount 插值
eye_height_standing = 64.0
eye_height_crouched = 46.0
body_height_standing = 40.0
body_height_crouched = 28.0

[aim_stats]
# 整场枪法统计（沿用 Leetify 的名称和口径）
# Time to Damage 不低于此值（秒）的样本排除，视为有意等待（Leetify 口径）
time_to_damage_max_seconds = 1.0
# 同一回合对同一敌人的伤害间隔超过此值（秒）才算新的一次遭遇
encounter_gap_seconds = 3.0
# 扫射：同一把武器、相邻两枪间隔不超过此值（秒），连续这么多发以上（Leetify：3 发以上）
spray_max_gap_seconds = 0.2
spray_min_shots = 3
# 样本数低于此值时不给出数值
min_samples = 5

[visibility]
# 视野计算：awpy 的地图碰撞网格做射线检测（只有静态几何，不含烟雾、门等动态物体）。
# 每项 [站立高度, 下蹲高度, 横向偏移]；高度相对脚底，按 duck_amount 插值；
# 横向偏移沿垂直于视线的水平方向，正负各列一项。
body_points = [
  [64.0, 46.0, 0.0], [40.0, 28.0, 0.0], [20.0, 14.0, 0.0], [6.0, 6.0, 0.0],
  [40.0, 28.0, 14.0], [40.0, 28.0, -14.0],
  [70.0, 52.0, 0.0], [62.0, 44.0, 6.0], [62.0, 44.0, -6.0],
  [54.0, 38.0, 16.0], [54.0, 38.0, -16.0],
]
# 烟雾线段仍取胸口，不依赖 body_points 的顺序。
chest_height = [40.0, 28.0]
# 视野范围（度，相对准星）：16:9 屏幕的水平半角约 53°、垂直半角约 37°
fov_horizontal_half = 53.0
fov_vertical_half = 37.0
# 往前找"第一次看见"最多回溯多少秒；视线中断不超过 gap 个 tick 视为没有中断（几何网格的缝隙）
first_seen_lookback_seconds = 3.0
first_seen_gap_ticks = 2
# 首次可见时剩余致盲不低于此秒数，则不计算这一方的 TTD 和准星。
# 闪光最后一段逐渐消退，剩余较短时已能看清部分画面；暂定 1 秒，待用数据校准。
blind_min_remaining_seconds = 1.0
# 烟雾：不能精确建模（CS2 的烟是体素，会被雷和子弹打散），只用来排除："第一次看见"那一刻视线经过烟雾附近时，
# 真正看见的时刻可能更晚，这次交火不计算 Time to Damage、Crosshair Placement。烟雾按球体近似，
# 中心在展开点上方 smoke_center_height，只在展开后 smoke_active_seconds 之间算有效。
# 校准（6 个 demo、736 次击杀）：被排除的 3%–5% 样本 Time to Damage 中位数 0.9–1.4 秒（确实被烟挡住），
# 保留样本的中位数几乎不变；半径 170、全程有效时会排除 20%–28%，过多
smoke_radius = 144.0
smoke_center_height = 40.0
smoke_active_seconds = [1.0, 18.0]

[counter_strafe]
# 开枪时水平速度低于武器最高速度的这个比例，算"已停稳"（Leetify 公开的口径）
accurate_speed_ratio = 0.34
# duck_amount 不低于此值算下蹲开枪；下蹲开枪不计入急停统计（Leetify 口径）
crouch_duck_amount = 0.5

[baseline]
# 某武器的有效交火少于此次数时，不生成该武器的逐次交火分布。
min_engagements = 30
# 压枪分段只统计这些自动武器，每发按其实际武器归组。
automatic_weapons = ["ak47", "m4a1", "m4a1_silencer"]
# recoil_index 从 0 开始；每段从该值起，到下一段起点减 1，最后一段不封顶。
spray_segment_starts = [0, 1, 3, 6, 10, 15]

[training]
# 额外标记为职业选手的 SteamID64；默认仅使用职业基准实际参与的选手名单
extra_pro_steamids = []
# 训练文字中允许出现的英文指标、武器简称和通用术语；练习图名称从 drills 自动加入
allowed_latin = ["Time to Damage", "Crosshair Placement", "Counter-Strafing", "Spray Accuracy", "Spotted Accuracy", "Headshot Accuracy", "TTD", "AK", "M4", "AWP", "CT", "T", "ms", "s", "u", "CS2", "5E", "USP", "Glock", "Deagle"]


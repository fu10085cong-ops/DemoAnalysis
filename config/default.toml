# 检测规则阈值配置。所有阈值都放在这里，代码中不要写死。
# 用户配置（--config）只需写要覆盖的条目，其余沿用这里的默认值。

[parsing]
# 支持的 tick rate（由 game_time 估算）；估算结果不在其中时报错
supported_tick_rates = [64, 128]
# 目标玩家数据完整性：回合进行中（冻结期结束 → 回合结束）坐标非空的 tick 占比下限
# 低于此值说明 demoparser2 没读到该玩家（docs/fields.md 陷阱 12），直接报错
min_target_coverage = 0.95
# 其他玩家低于此占比时只记警告（影响与其相关的指标）
min_other_coverage = 0.95
# demo 中没有 mp_buytime 设置时使用的购买时间（秒）；官方竞技模式为 20
default_buytime_seconds = 20
# 中途掉线 / 重连（docs/fields.md 陷阱 24）：回合进行中至少这一比例的 tick 没有队伍、
# 且该玩家这一回合没有任何开枪、伤害、击杀、死亡事件，算"不在场"，不计入覆盖率和问题频率
absent_team_ratio = 0.5
# 不在场的回合超过总回合数的这一比例时不做排除（数据多半有别的问题），仍按覆盖率报错
max_absent_round_share = 0.5

[moments]
# 交火窗口（动态回溯）：从击杀 / 死亡往前，把双方的开枪和互相伤害串起来，
# 相邻两次间隔不超过 gap 秒就算同一次交火；整段最长不超过 max 秒
engagement_gap_seconds = 1.0
engagement_max_seconds = 5.0
# 补枪：被击杀后多少秒内击杀者被队友击杀，算"被补回"；反之亦然
trade_window_seconds = 3.0
# 漏补：队友阵亡时目标玩家与他的直线距离不超过此值（游戏单位）才算"在附近"。不考虑视线，只是近似
missed_trade_max_distance = 800
# 关键助攻：闪光助攻，或本回合对被击杀者造成的伤害不低于此值（记分板的伤害助攻本身要求 > 40）
key_assist_min_damage = 60
# 死亡时算"被闪中"的最短致盲时长（秒）。不到 1 秒的多是擦边闪（docs/fields.md §7）
min_blind_seconds = 1.0
# 游戏内跳转：跳到交火开始前多少秒
jump_lead_seconds = 5.0
# 接触时刻（双方中较早看见对方的那一 tick）前这么多秒内的平均速度，用来判断谁在移动、谁在架点
contact_speed_window_seconds = 0.25
# 平均速度低于 still 算"几乎静止"（架点），不低于 moving 算"在移动"（跑动、静步），中间（减速、急停中）不下结论。
# 依据：3 个 demo、878 个样本的速度分布有两个峰（0–10 和 200–220），中间 20–120 是过渡状态
contact_still_speed = 40.0
contact_moving_speed = 120.0

[weapons.min_shot_interval_seconds]
# 同一把枪两次开枪的最短间隔（秒）。用 10 个 5E / 完美 demo 中同一玩家同一把枪相邻两次开枪的间隔实测（1 分位），
# 与游戏设定一致（AWP 拉栓约 1.45 秒）。用来判断阵亡时是否来得及再开一枪；只列开枪间隔长、会影响判断且样本足够实测的武器
awp = 1.45
ssg08 = 1.25
mag7 = 0.84
deagle = 0.22

[aim]
# 判断一发子弹打向哪个敌人：取子弹方向与"眼睛 → 敌人身体中心"夹角最小的存活敌人（取开枪前一 tick 的位置）。
# 用命中的子弹核对，5 个样本 demo 中 96%–99% 判对；命中子弹的夹角 99 分位约 10°
# 最近的敌人也超过这个角度（度）时，认为这发子弹没有瞄准任何人
max_target_angle = 20.0
# 高度都是相对脚底（Z）的估计值，站立与下蹲之间按 duck_amount 插值
eye_height_standing = 64.0
eye_height_crouched = 46.0
body_height_standing = 40.0
body_height_crouched = 28.0

[aim_stats]
# 整场枪法统计（沿用 Leetify 的名称和口径）
# Time to Damage 不低于此值（秒）的样本排除，视为有意等待（Leetify 口径）
time_to_damage_max_seconds = 1.0
# 同一回合对同一敌人的伤害间隔超过此值（秒）才算新的一次遭遇
encounter_gap_seconds = 3.0
# 扫射：同一把武器、相邻两枪间隔不超过此值（秒），连续这么多发以上（Leetify：3 发以上）
spray_max_gap_seconds = 0.2
spray_min_shots = 3
# 样本数低于此值时不给出数值
min_samples = 5

[visibility]
# 视野计算：awpy 的地图碰撞网格做射线检测（只有静态几何，不含烟雾、门等动态物体）。
# 核对：普通击杀（非穿墙、非穿烟）前一 tick 击杀者能看到受害者的比例为 94%–99%（8 个样本 demo）
# 判断"看得到"时检查对手身上的这些点，任一点没被挡住即算看到（Leetify：能看到身体的任何部分）。
# 高度相对脚底，[站立, 下蹲]，按 duck_amount 插值；胸口另取左右两侧
body_points_standing = [64.0, 40.0, 20.0, 6.0]
body_points_crouched = [46.0, 28.0, 14.0, 6.0]
body_side_offset = 14.0
# 视野范围（度，相对准星）：16:9 屏幕的水平半角约 53°、垂直半角约 37°
fov_horizontal_half = 53.0
fov_vertical_half = 37.0
# 往前找"第一次看见"最多回溯多少秒；视线中断不超过 gap 个 tick 视为没有中断（几何网格的缝隙）
first_seen_lookback_seconds = 3.0
first_seen_gap_ticks = 2
# 首次可见时剩余致盲不低于此秒数，则不计算这一方的 TTD 和准星。
# 闪光最后一段逐渐消退，剩余较短时已能看清部分画面；暂定 1 秒，待用数据校准。
blind_min_remaining_seconds = 1.0
# 烟雾：不能精确建模（CS2 的烟是体素，会被雷和子弹打散），只用来排除："第一次看见"那一刻视线经过烟雾附近时，
# 真正看见的时刻可能更晚，这次交火不计算 Time to Damage、Crosshair Placement。烟雾按球体近似，
# 中心在展开点上方 smoke_center_height，只在展开后 smoke_active_seconds 之间算有效。
# 校准（6 个 demo、736 次击杀）：被排除的 3%–5% 样本 Time to Damage 中位数 0.9–1.4 秒（确实被烟挡住），
# 保留样本的中位数几乎不变；半径 170、全程有效时会排除 20%–28%，过多
smoke_radius = 144.0
smoke_center_height = 40.0
smoke_active_seconds = [1.0, 18.0]

[counter_strafe]
# 开枪时水平速度低于武器最高速度的这个比例，算"已停稳"（Leetify 公开的口径）
accurate_speed_ratio = 0.34
# duck_amount 不低于此值算下蹲开枪；下蹲开枪不计入急停统计（Leetify 口径）
crouch_duck_amount = 0.5

[baseline]
# 某武器的有效交火少于此次数时，不生成该武器的逐次交火分布。
min_engagements = 30
# 压枪分段只统计这些自动武器，每发按其实际武器归组。
automatic_weapons = ["ak47", "m4a1", "m4a1_silencer"]
# recoil_index 从 0 开始；每段从该值起，到下一段起点减 1，最后一段不封顶。
spray_segment_starts = [0, 1, 3, 6, 10, 15]

[training]
# 额外标记为职业选手的 SteamID64；默认仅使用职业基准实际参与的选手名单
extra_pro_steamids = []

# 各武器最高移动速度（u/s，规范名）。标"实测"的已用 24 个样本 demo 的速度分布核对（95/99 分位恰好等于该值），
# 其余样本量不够，取游戏数值
[counter_strafe.max_speed]
# 实测
ak47 = 215
galilar = 215
m4a1 = 225
m4a1_silencer = 225
famas = 220
aug = 220
awp = 200
ssg08 = 230
deagle = 230
glock = 240
usp_silencer = 240
p250 = 240
fiveseven = 240
tec9 = 240
elite = 240
mac10 = 240
mp9 = 240
mp7 = 220
p90 = 230
xm1014 = 215
negev = 150
# 游戏数值，未实测
sg556 = 210
ump45 = 230
bizon = 240
mp5sd = 235
nova = 220
mag7 = 225
sawedoff = 210
m249 = 195
scar20 = 215
g3sg1 = 215
hkp2000 = 240
cz75a = 240
revolver = 220

# 开镜时的最高速度
[counter_strafe.max_speed_scoped]
# 实测
awp = 100
ssg08 = 230
aug = 150
# 游戏数值，未实测
sg556 = 150
scar20 = 120
g3sg1 = 120

[problems]
# died_without_seeing：几何视野仍可能漏判部分模型，暂时停用，待用数据校准
# turned_into_flash：路人并不比职业多，主要反映对手的道具水平，降为背景
# weapon_not_ready：路人与职业一样多，多数是被迫的，降为背景
# spray_while_moving：几乎不触发，暂时停用，待用数据校准
# awp_unscoped_shot：路人样本中零次，暂时停用，待用数据校准
disabled = ["died_without_seeing", "turned_into_flash", "weapon_not_ready", "spray_while_moving", "awp_unscoped_shot"]
# 整场同一发数段难以积累足够子弹，暂时关闭；不影响单次交火，待用数据校准
spray_match_enabled = false
# 假设真实频率与职业相同，单场碰巧出现至少本场次数的最大概率
frequency_max_chance = 0.05
# 相比职业频率预期至少多出几次才算突出
frequency_min_excess = 2
# AWP 超过此距离的未开镜射击参与检测（米，待用数据校准）
awp_noscope_max_distance_m = 5.0
# 单次交火压枪评价从第 4 发开始，recoil_index 从 0 起算
spray_late_recoil_index = 3
# 单次交火后段至少需要的子弹数
spray_min_late_shots = 6
# 比职业期望命中率低多少个百分点才命中
spray_margin_pct = 15.0
# 整场按武器、按发数段评价至少需要的子弹数
spray_min_segment_shots = 30
# 移动扫射评价从连射第 2 发开始，排除首枪
spray_moving_min_recoil_index = 1
# 移动扫射评价至少需要的连续射击子弹数
spray_moving_min_shots = 4
# 移动扫射中未停稳子弹的比例阈值（待用数据校准）
spray_moving_ratio = 0.5

[checker]
# 一份提交的问题结论数量上限
max_findings = 6
# 反复出现的问题数量上限
max_patterns = 3
# 亮点数量上限
max_highlights = 3
# other 类结论数量上限（跨问题、规律与亮点合计）
max_other = 3
# 单条问题结论关联的目标数量上限
  max_finding_targets = 2
# 单条规律关联的目标数量上限，首版最多列举十个
max_pattern_targets = 10
# 单条亮点关联的目标数量上限
max_highlight_targets = 3
# 训练计划条目数量上限
max_training_plan_items = 5
# 总览文字长度上限（字符），内容应为三到五句
max_overview_length = 600
# 问题分析文字长度上限（字符）
max_finding_analysis_length = 1200
# 单条训练建议长度上限（字符）
max_training_length = 600
# 规律分析文字长度上限（字符）
max_pattern_analysis_length = 1200
# 亮点分析文字长度上限（字符）
max_highlight_analysis_length = 600
# 每条训练计划文字长度上限（字符）
max_training_plan_item_length = 600
# 约、大约、接近、左右等近似表达的相对数值容差，首版为百分之十
number_relative_tolerance = 0.10
# 近似数值比较的绝对容差，仅用于消除浮点运算误差
number_absolute_tolerance = 0.000000001
# 常见分位数标签，不把“75 分位”或“p90”当成比赛事实数字
quantile_labels = [25, 50, 75, 90]

# 每项 pattern 为敏感说法正则，require 为必须具备的数据谓词；谓词名称严格校验
[[checker.phrases]]
# “没看到”类说法只允许几何视野明确未看到
pattern = "没看到|没看见|没发现"
require = "not_seen"

[[checker.phrases]]
# 致盲说法需要交火或死亡致盲记录
pattern = "被闪|吃闪|闪白|致盲"
require = "blind"

[[checker.phrases]]
# 主动拉出需要接触类型证据
pattern = "干拉|主动拉出|拉出来"
require = "peek"

[[checker.phrases]]
# 架点可指本人，也可指主动拉出时的对手
pattern = "架点|架枪|卡点"
require = "held"

[[checker.phrases]]
# 先后看见必须有可用的看见时间差
pattern = "先看见|先发现|后看见"
require = "seen_order"

[[checker.phrases]]
# 先后开枪必须有双方第一枪时间差
pattern = "先开枪|后开枪"
require = "shot_order"

[[checker.phrases]]
# 补枪说法需要补枪字段或漏补枪回合记录
pattern = "补枪|补回|没人补"
require = "trade"

[[checker.phrases]]
# 停稳说法需要首枪或逐枪的停稳数据
pattern = "急停|停稳|没停"
require = "stopped"

[[checker.phrases]]
# 压枪说法需要连射序号达到第二发
pattern = "压枪|扫射|连射"
require = "spray"

[[checker.phrases]]
# 拉栓说法需要死亡时武器明确不能开枪
pattern = "拉栓|还不能开枪"
require = "weapon_not_ready"

[ai]
# 用哪个模型服务：deepseek / claude（各自的设置在下面对应的表里）
provider = "deepseek"
# 一次诊断最多请求几轮（含工具调用和引用修正）
max_turns = 10
# 结构化提交未通过检查时最多允许修改几轮，之后删除违规结论
max_repairs = 2

[ai.deepseek]
# OpenAI 兼容接口。凭据：环境变量 DEEPSEEK_API_KEY
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
# deepseek-v4-pro（推理更强）或 deepseek-flash（更便宜）
model = "deepseek-v4-pro"
# 思考模式（DeepSeek 默认开启）；推理深度：low / high / max
thinking = true
reasoning_effort = "high"
max_tokens = 32000

[ai.claude]
# 凭据：环境变量 ANTHROPIC_API_KEY，或 `ant auth login` 登录后的配置
model = "claude-opus-5-5"
# 推理深度：low / medium / high / xhigh / max。诊断要求准确，默认 high
effort = "high"
max_tokens = 16000
# 模型因安全策略拒绝时，由服务端自动换推荐的备用模型重试
server_fallback = true

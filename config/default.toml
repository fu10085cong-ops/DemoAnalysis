# 单条亮点关联的目标数量上限
max_highlight_targets = 3
# 训练计划条目数量上限
max_training_plan_items = 5
# 总览文字长度上限（字符），内容应为三到五句
max_overview_length = 600
# 问题分析文字长度上限（字符）
max_finding_analysis_length = 1200
# 单条训练建议长度上限（字符）
max_training_length = 600
# 规律分析文字长度上限（字符）
max_pattern_analysis_length = 1200
# 亮点分析文字长度上限（字符）
max_highlight_analysis_length = 600
# 每条训练计划文字长度上限（字符）
max_training_plan_item_length = 600
# 约、大约、接近、左右等近似表达的相对数值容差，首版为百分之十
number_relative_tolerance = 0.10
# 近似数值比较的绝对容差，仅用于消除浮点运算误差
number_absolute_tolerance = 0.000000001
# 常见分位数标签，不把“75 分位”或“p90”当成比赛事实数字
quantile_labels = [25, 50, 75, 90]
# 单场 finding 的代表交火只能从每个问题按代表性排序的前几名中选（多场用 summary.representatives_per_problem）
finding_candidates = 3
# “站位偏散/离队友远”“离队友近”的距离门槛（游戏单位）。依据补枪概率实测：
# 阵亡时最近队友 < 300 单位被补回约 34%，> 1000 单位约 5%（docs/product.md「思路分析的方法」）
teammate_far_distance = 1000.0
teammate_near_distance = 300.0
# “近距离/短距离”“远距离/中远距离”说法的交火距离门槛（米，与事实卡相同）
close_range_m = 12.0
long_range_m = 20.0
# 距离说法里可夹在距离词与交火名词之间的武器名；含 WEAPON_LABELS 显示名及常用简称
range_weapon_words = [
  "AK-47", "M4A4", "M4A1-S", "AWP", "USP-S", "Glock-18", "Desert Eagle", "SSG 08",
  "P2000", "P250", "Tec-9", "Five-SeveN", "CZ75-Auto", "Galil AR", "FAMAS", "AUG",
  "SG 553", "MAC-10", "MP9", "MP7", "UMP-45", "P90", "MAG-7", "Nova", "XM1014",
  "手雷", "燃烧", "刀", "AK", "M4", "沙鹰", "大狙", "步枪", "手枪", "冲锋枪",
]
# "主要慢在哪一段"至少占 TTD 的比例
segment_major_ratio = 0.5

[checker.map_aliases]
de_dust2 = ["de_dust2", "dust2", "沙二", "沙2", "炙热沙城"]
de_mirage = ["de_mirage", "mirage", "米拉日", "荒漠迷城"]
de_inferno = ["de_inferno", "inferno", "炼狱小镇"]
de_ancient = ["de_ancient", "ancient", "远古遗迹"]
de_anubis = ["de_anubis", "anubis", "阿努比斯"]
de_nuke = ["de_nuke", "nuke", "核子危机"]
de_cache = ["de_cache", "cache", "死城之谜"]
de_train = ["de_train", "train", "列车停放站"]
de_overpass = ["de_overpass", "overpass", "死亡游乐园"]
de_vertigo = ["de_vertigo", "vertigo", "殒命大厦"]

# 每项 pattern 为敏感说法正则，require 为必须具备的数据谓词；谓词名称严格校验
# scope 可选：any（默认，至少一个 target 满足）或 all（targets 中的瞬间全部满足）
[[checker.phrases]]
# “没看到”类说法只允许几何视野明确未看到
pattern = "没看到|没看见|没发现"
require = "not_seen"

[[checker.phrases]]
# 致盲说法需要交火或死亡致盲记录
pattern = "被闪|吃闪|闪白|致盲"
require = "blind"

[[checker.phrases]]
# 主动拉出需要接触类型证据
pattern = "干拉|主动拉出|拉出来"
require = "peek"

[[checker.phrases]]
# 架点可指本人，也可指主动拉出时的对手
pattern = "架点|架枪|卡点"
require = "held"

[[checker.phrases]]
# 先后看见必须有可用的看见时间差
pattern = "先看见|先发现|后看见"
require = "seen_order"

[[checker.phrases]]
# 先后开枪必须有双方第一枪时间差
pattern = "先开枪|后开枪"
require = "shot_order"

[[checker.phrases]]
# 补枪说法需要补枪字段或漏补枪回合记录
pattern = "补枪|补回|没人补"
require = "trade"

[[checker.phrases]]
# 停稳说法需要首枪或逐枪的停稳数据
pattern = "急停|停稳|没停"
require = "stopped"

[[checker.phrases]]
# 压枪说法需要连射序号达到第二发
pattern = "压枪|扫射|连射"
require = "spray"

[[checker.phrases]]
# 拉栓说法需要死亡时武器明确不能开枪
pattern = "拉栓|还不能开枪"
require = "weapon_not_ready"

[[checker.phrases]]
# 下包后的描述需有瞬间或漏补记录的下包证据；否定和下包前不触发
pattern = "(?<!没)(?<!未)(?<!还没)(?:下包后|下包的残局)|(?<!没)(?<!未)(?:已下包|包已下)"
require = "planted"

[[checker.phrases]]
# “下包前”类说法需有未下包的证据（本地模型曾把已下包时的闪光助攻写成“下包前”，020）
pattern = "下包前|下包之前|没下包|未下包|包还没下"
require = "not_planted"

[[checker.phrases]]
# 人数优劣的说法需有对应的人数（评测：5v5 被写成"人数劣势"）
pattern = "人数劣势|少打多|以少打多|人数落后|人少"
require = "man_disadvantage"

[[checker.phrases]]
pattern = "人数优势|人数领先|人数占优|多打少|以多打少"
require = "man_advantage"

[[checker.phrases]]
# "守包"只能是 T 方下包之后；CT 在下包后是回防、拆包（评测：CT 回防被写成"守包"）
pattern = "守包|守着包|保护炸弹"
require = "t_post_plant"

[[checker.phrases]]
# 以下"都……"概括要求每个引用的交火都成立（评测：两次交火只有一次先开枪，却写成"都先开枪"）
pattern = "都(?:是)?(?:你)?先开枪|(?:始终|每次)(?:都)?(?:是)?(?:你)?先开枪"
require = "shot_first"
scope = "all"

[[checker.phrases]]
pattern = "都(?:是)?(?:你)?先(?:看见|发现)|(?:始终|每次)(?:都)?(?:是)?(?:你)?先(?:看见|发现)"
require = "seen_first"
scope = "all"

[[checker.phrases]]
pattern = "都没(?:有)?(?:能)?(?:来得及)?开枪|都没(?:有)?开火|(?:始终|每次)都?没(?:有)?开枪"
require = "no_shots"
scope = "all"

[[checker.phrases]]
pattern = "都没(?:有)?(?:打中|命中)|都一发(?:未|没)中|(?:始终|都)(?:拿|打)不(?:到|出)伤害|(?:始终|都)没(?:有)?打出伤害|全部(?:打空|落空)"
require = "no_hits"
scope = "all"

[[checker.phrases]]
# 描述交火距离的说法要和实际距离一致（评测：28 米被说成"短距离交火"）。
# 只匹配“近距离交火/对枪/遭遇”这类描述，不匹配“拉近距离”“近距离时……”这类建议
pattern = '(?:近距离|短距离|贴脸|近身)\s*(?:的\s*)?(?:(?:(?:用|拿|持)\s*)?{weapon}\s*(?:的\s*)?)?(?:交火|对枪|遭遇|接敌|对拼|对狙)'
require = "close_range"

[[checker.phrases]]
pattern = '(?:远距离|中远距离|长距离)\s*(?:的\s*)?(?:(?:(?:用|拿|持)\s*)?{weapon}\s*(?:的\s*)?)?(?:交火|对枪|遭遇|接敌|对拼|对狙)'
require = "long_range"

[[checker.phrases]]
# round_time_s 只有已过时间，不能据此推算回合剩余时间
pattern = "回合还剩"
require = "never"

[[checker.phrases]]
# 把引用的瞬间统称为死亡时，必须全部是死亡（flash 曾把一次击杀写成“这两次死亡”）
pattern = "(?:这|两|二|2|几)\\s*(?:次|处)\\s*(?:都是)?(?:死亡|阵亡)|都(?:是)?(?:死亡|阵亡)|(?:两|几)次都(?:被击杀|被杀|阵亡)"
require = "death"
scope = "all"

[[checker.phrases]]
# 把引用的瞬间统称为击杀时，必须全部是击杀
pattern = "(?:这|两|二|2|几)\\s*(?:次|处)\\s*(?:都是)?击杀|都(?:是|完成了?)?击杀"
require = "kill"
scope = "all"

[[checker.phrases]]
# 说和队友离得远、站位分散，需要有与队友距离足够远的记录
pattern = "站位(?:偏|太|过于|比较|较)?(?:分)?散|拉得太开|离队友(?:很|太|较|偏|比较)?远|和队友(?:之间)?(?:的)?距离(?:很|太|较|偏|比较)?远|队友(?:都)?离(?:你|得)(?:很|太|较|偏|比较)?远"
require = "teammate_far"

[[checker.phrases]]
# 说和队友离得近，需要有与队友距离足够近的记录
pattern = "离队友(?:很|非常|比较)?近|和队友(?:之间)?(?:的)?距离(?:很|非常|比较)?近|队友就在(?:身边|旁边|附近)|贴着队友"
require = "teammate_near"

[[checker.phrases]]
# mac首次与 flash_新基准26份评测：把较短的看见→开枪段说成主要慢点
pattern = '(?:主要|大半|大部分|多半|集中)[^，。！？；\n]{0,30}(?:看见(?:对手)?(?:到|→)(?:打出)?(?:第一枪|第1枪|开枪)|开枪前)|(?:看见(?:对手)?(?:到|→)(?:打出)?(?:第一枪|第1枪|开枪)|开枪前)[^，。！？；\n]{0,30}(?:主要|大半|大部分|多半|集中)|共同点是从看见对手到打出第一枪[^，。！？；\n]{0,12}偏长'
require = "seen_to_shot_major"
scope = "all"

[[checker.phrases]]
# mac首次评测的同类分段说法：开枪→命中占主要时间才可概括
pattern = '(?:主要|大半|大部分|多半|集中)[^，。！？；\n]{0,30}开枪(?:到|→)命中|开枪(?:到|→)命中[^，。！？；\n]{0,30}(?:主要|大半|大部分|多半|集中)'
require = "shot_to_hit_major"
scope = "all"

[[checker.phrases]]
# mac首次评测：下包前 4v4 被称为残局；只查描述这次交火的用语
pattern = '残局(?:里|中|对枪|击杀)|(?:这次|一次)残局里'
require = "clutch"

[[checker.phrases]]
# mac首次评测：下包前 4v4 被称为回防；对手可能回防的通道是建议，不查
pattern = '(?<!对手)(?<!敌人)(?<!对面)(?<!对手可能)(?<!敌人可能)(?<!对面可能)回防(?:或残局里|中|里|时|阶段|对枪|交火|击杀)'
require = "ct_retake"

[ai]
# 用哪个模型服务：deepseek / claude / local（各自的设置在下面对应的表里）
provider = "deepseek"
# 一次诊断最多请求几轮（含工具调用和引用修正）
max_turns = 10
# 结构化提交未通过检查时最多允许修改几轮，之后删除违规结论
max_repairs = 2

[ai.deepseek]
# OpenAI 兼容接口。凭据：环境变量 DEEPSEEK_API_KEY
base_url = "https://api.deepseek.com"
api_key_env = "DEEPSEEK_API_KEY"
# 默认 deepseek-flash（便宜）；需要更细的分析时用命令行 --model deepseek-v4-pro（推理更强，约贵十倍）
model = "deepseek-flash"
# 思考模式（DeepSeek 默认开启）；推理深度：low / high / max
thinking = true
reasoning_effort = "high"
max_tokens = 32000
reasoning_field = "reasoning_content"

[ai.local]
# Ollama 的 OpenAI 兼容接口地址
base_url = "http://localhost:11434/v1"
# 需提前用 Modelfile 创建带 40960 token 上下文的本地模型
model = "qwen3-14b-40k"
# 留空表示无需密钥，SDK 使用占位值
api_key_env = ""
# 回复 token 上限，包含模型思考过程
max_tokens = 8192
# Ollama 返回思考内容的字段名
reasoning_field = "reasoning"
# 启动前查询 Ollama 的 num_ctx；其他兼容服务可设为 none
context_check = "ollama"
# 为后续输出保留的上下文余量
context_margin_tokens = 2048
# 输入估算：字符数乘以此系数得到 token 数
chars_per_token = 0.76
# 最多允许的查询工具调用次数（不含 submit_report）
max_tool_calls = 8

[ai.claude]
# 凭据：环境变量 ANTHROPIC_API_KEY，或 `ant auth login` 登录后的配置
model = "claude-opus-5-5"
# 推理深度：low / medium / high / xhigh / max。诊断要求准确，默认 high
effort = "high"
max_tokens = 16000
# 模型因安全策略拒绝时，由服务端自动换推荐的备用模型重试
server_fallback = true

# 分级报告 L0：每类问题的固定说明（程序直接排进报告，不经过 AI）。2026-10-16 草稿，措辞待产品负责人确认。
# why：为什么这是问题；fix：标准改法。练习图按 config/default.toml 的 [[training.drills]] 自动附上。

[slow_reaction]
why = "从看见对手到开出第一枪用时偏长，对手会先拿到打中你的机会。慢的原因可能是看见后才去找准星，或者开枪前还在调整。"
fix = "接敌前先把准星放到对手会出现的位置和高度，看见人后用最少的修正打出第一发；第一发打出前先停稳。"

[poor_crosshair_placement]
why = "看见对手时准星离他很远，需要大幅甩枪才能打中，既拖慢首发，也更容易打空。"
fix = "移动和等人时，准星一直贴在对手可能出现的位置和头部高度；转点、进点前先把准星预置好，接敌时只做小幅修正。"

[shot_while_moving]
why = "第一枪在还没停稳时打出，移动中的子弹会散开，这一枪很难命中。"
fix = "接敌前按反方向键急停，速度降下来再开第一枪；来不及停稳时宁可晚一点开枪。"

[peeked_into_held_angle]
why = "自己移动进入对手视野时，对手几乎静止、已经架好枪，他更容易先开枪。"
fix = "不要单人直接拉进对手可能架着的角度：先用道具影响他的视线，或等队友一起拉出、形成交叉火力。"

[dry_peek_with_utility]
why = "身上还有道具却直接拉出，对手的视线没有被任何道具影响，等于放弃了可以利用的优势。"
fix = "拉出前先想一想身上的道具能否用上：闪光逼对手转头、烟封住他的视线、燃烧瓶逼他挪位置，然后再拉。"

[overpeek_in_advantage]
why = "人数占优时主动拉出被击杀、而且没有被补回，把已有的人数优势交还给了对手。"
fix = "人数领先时让对手先动：守住交叉火力、等队友就位或用道具逼对手出来，不要一个人去抢位置。"

[missed_trade]
why = "队友在你附近阵亡，击杀者随后出现在你的屏幕里，你却没在补枪窗口内把他换掉，队伍白白少了一个人。"
fix = "和队友保持能互相补枪的距离和角度；队友开始交火时，你要准备好第一时间对着同一个位置补枪。"

[post_plant_utility_unused]
why = "下包后阵亡时身上还带着燃烧瓶，没用来阻止对手拆包。"
fix = "下包后提前想好燃烧瓶的落点，对手准备拆包时扔到包上，拖延拆包时间。"

[died_while_reloading]
why = "子弹没打空就主动换弹，结果换弹时被打死。"
fix = "交火间隙先确认周围安全，再决定是否换弹；弹匣还有子弹时，优先保留随时开枪的能力。"

[saw_but_no_shot]
why = "看见对手后有足够时间开枪，却一直没有还击就阵亡。"
fix = "接敌前把准星预置在对手可能出现的位置；看见人后及时停稳并打出第一枪。"

[spray_control]
why = "连发的后段子弹命中率明显低于职业水平，说明压枪没有跟上弹道。"
fix = "先练好前十发的压枪弹道；实战中中远距离改用短点射，压不住时就停火重新瞄准。"

[overspray_at_range]
why = "远距离一直扫射，后段子弹几乎打不中，还暴露了自己的位置。"
fix = "远距离用点射或短连发，打几发停一下重新瞄准，不要把整个弹匣扫完。"

[awp_moving_shot]
why = "拿狙击枪时在移动中开枪，没有停稳的狙击枪几乎不可能命中。"
fix = "开镜开枪前先急停，确认停稳后再开火。"

[awp_repeek_same_angle]
why = "开枪后在同一个位置重复拉出，对手已经知道你的位置，会提前架住这里。"
fix = "开枪后换一个位置或换一个角度再出现，不要在同一个点反复拉。"

[awp_close_range_duel]
why = "拿狙击枪在近距离和对手对枪，一枪没中就很难再有机会。"
fix = "狙击枪尽量在中远距离使用；近距离时拉开距离，或切换副武器。"

[pistol_spam]
why = "手枪连点太快，准度还没恢复就开下一枪，后面的子弹会散开。"
fix = "手枪点射时控制节奏，每一枪之间留出准度恢复的时间。"

[deagle_moving_shot]
why = "沙鹰在移动中开枪，准度很差，第一枪很难命中。"
fix = "沙鹰开枪前一定先停稳，打完一枪再移动。"

[glock_long_range]
why = "用 Glock 在远距离和对手对枪，伤害和精度都很吃亏，很容易被反杀。"
fix = "Glock 在近距离使用；远距离时退回掩体，等对手靠近或和队友一起打。"

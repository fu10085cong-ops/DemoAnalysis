name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install rar extractor (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - name: Install
        run: |
          python -m pip install uv
          uv pip install --system -e ".[dev]"
      - name: Test
        run: python -m pytest -v -rs
      - name: CLI smoke test
        run: python -m cs2coach --help

  # 在 Windows 上实际编译修复版 demoparser2，并把 wheel 作为附件上传，供本地直接安装
  build-demoparser-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          python -m pip install uv
          choco install protoc -y --no-progress
      - name: Build
        run: python scripts/build_demoparser.py
      - name: Verify wheel imports
        shell: pwsh
        run: |
          $whl = Get-ChildItem vendor/wheels/demoparser2-*.whl | Select-Object -First 1
          python -m pip install pandas $whl.FullName
          python -c "import demoparser2; print('demoparser2 OK', demoparser2.DemoParser)"
      - uses: actions/upload-artifact@v4
        with:
          name: demoparser2-windows-wheel
          path: vendor/wheels/*.whl

[project]
name = "cs2coach"
version = "0.1.0"
description = "CS2 demo 赛后复盘分析工具：解析 demo、规则检测操作问题、生成带证据的复盘报告"
requires-python = ">=3.11"
dependencies = [
    # PyPI 0.42.0 有实体句柄 bug（docs/fields.md 陷阱 12），开发时用 scripts/build_demoparser.py 编译的修复版覆盖安装
    "demoparser2>=0.38",
    "pandas>=2.2",
    "pyarrow>=26.0.0",
    "pydantic>=2.7",
    "rarfile>=4.2",
    # 视野计算：地图碰撞网格 + 射线检测（awpy-data 发布的 .mesh）
    "awpy>=3.0,<4",
    # AI 诊断：Claude 用官方 SDK；DeepSeek 等 OpenAI 兼容接口用 openai SDK
    "anthropic>=1.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cs2coach = "cs2coach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs2coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
